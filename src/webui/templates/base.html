<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OneManDubbing{% endblock %}</title>
    <link rel="stylesheet" href="/static/style_brutalist.css?v={{ static_version }}">
</head>
<body>
    <header class="site-header">
        <h1>ONEMANDUBBING</h1>
        <nav class="step-nav">
            <a class="step-tag{% if request.url.path.startswith('/step1') %} active{% endif %}" href="/step1/">01 REFERENCE</a>
            <a class="step-tag{% if request.url.path.startswith('/step2') %} active{% endif %}" href="/step2/{% if voice_name %}?voice_name={{ voice_name }}{% endif %}">02 TRAINING</a>
            <a class="step-tag{% if request.url.path.startswith('/step3') %} active{% endif %}" href="/step3/{% if voice_name %}?voice_name={{ voice_name }}{% endif %}">03 DUBBING</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
